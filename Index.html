<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketMate</title>
  <meta http-equiv="refresh" content="5;url=homepage.html">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body{
      width: 100%;
      height: 100%;
    }
    body{
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: #F8F8FE;
    }
    .loading-screen{
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      isolation: isolate;
      overflow: hidden;
      background: #F8F8FE;
    }
    .loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("images/loading.png");
      background-position: cover;
      background-repeat: no-repeat;
      background-size:cover;
      filter: blur(2px);
    }
    .loading-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(108, 78, 246, 0.08);
      pointer-events: none;
    }
  
    .loading-container {
      width: min(420px, 92vw);
      padding: 34px 32px 30px;
      text-align: center;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(30, 31, 59, 0.22);
      animation: popIn 0.55s ease-out both;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .site-name {
      margin-bottom: 24px;
      color: #6C4EF6;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .loading-bar {
      position: relative;
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius:999px;
      background: #ECE8FF;
      box-shadow: inset 0 1px 2px rgba(108, 78, 246, 0.12);
    }
    .loading-progress {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #6C4EF6,
        #8B6CFF,
        #6C4EF6
      );
      background-size: 200% 100%;
      box-shadow: 0 0 18px rgba(108, 78, 246, 0.35);
      animation:
        fillBar 5s cubic-bezier(0.65, 0, 0.35, 1) forwards,
        shimmer 1.2s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      color: #666;
      font-size: 14px;
      font-weight: 500;
    }
    @keyframes fillBar {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }
      to {
        background-position: -200% 0;
      }
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-container {
        animation: none;
      }
      .loading-progress {
        animation: fillBar 5s linear forwards;
      }
    }
  </style>
</head>
<body>
  <main class="loading-screen">
    <section class="loading-container">
      <div class="logo">
        <img src="images/logo.png" alt="PocketMate Logo">
      </div>
      <h1 class="site-name">PocketMate</h1>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <p class="loading-text">Loading your finances...</p>
    </section>
  </main>
</body>
</html>
